[pytest]
addopts = -v --cov=full.test_full_pb2 --cov=optimized.test_optimized_pb2 --cov=proto3.test_proto3_pb2 --cov=simple.test_pb2 --cov-report=html -n 1
testpaths = common full optimized proto3 simple
pythonpath = . common
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: mark a test as slow-running
filterwarnings =
    ignore:Skipping collection of '.hypothesis':UserWarning
