syntax = "proto3";

package editions;

// proto3 strings resolve to features.utf8_validation = VERIFY.
message Utf8Proto3 {
  string s = 1;
  repeated string rs = 2;
  oneof choice {
    string os = 3;
    int32 oi = 4;
  }
  map<string, string> m = 5;
  bytes raw = 6;
  Utf8Proto3 child = 7;
  repeated Utf8Proto3 children = 8;
}
